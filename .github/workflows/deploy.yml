name: Deploy Text Summarizer

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Text Summarizer
        run: |
          echo "🚀 Starting Tender frontend deployment..."

          cd /var/www/Text_Summarizer

          echo "📥 Pulling latest code..."
          git fetch --all
          git reset --hard origin/main
          git pull origin main
          echo "✅ Done Pulling latest code..."

          echo "🐍 Activating virtual environment..."
          source venv/bin/activate

          echo "📦 Installing backend dependencies..."
          pip install -r requirements.txt
          echo "✅ Done Installing backend dependencies..."

          echo "🔄 Restarting services..."
          sudo systemctl daemon-reload
          sudo systemctl restart textsummarizer
          sudo systemctl restart nginx
          echo "✅ Done Restarting backend service..."

          echo "✅ Text Summarizer deployment complete!"