name: Deploy Text Summarizer (Docker CI/CD)

on:
  push:
    branches:
      - main

jobs:

  # -------------------------
  # BUILD + PUSH IMAGE
  # -------------------------
  build-and-push:
    name: Build & Push Docker Image
    runs-on: [self-hosted, ts]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Docker Image
        run: |
          export DOCKER_BUILDKIT=1

          echo "🏗️ Building image (with BuildKit)"
          docker build \
            -t krish1908/text-summarizer:v${{ github.run_number }} \
            .

          echo "📤 Pushing image"
          docker push krish1908/text-summarizer:v${{ github.run_number }}

