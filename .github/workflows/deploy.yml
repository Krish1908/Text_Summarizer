  # -------------------------
  # DEPLOY TO ON-PREM
  # -------------------------
  deploy-onprem:
    name: Deploy to On-Prem
    runs-on: [self-hosted, ts, on-prem]
    needs: build-and-push

    steps:
      - name: Deploy via Docker (On-Prem)
        run: |
          echo "🚀 Deploying to On-Prem..."

          echo "📥 Pull versioned image"
          docker pull krish1908/text-summarizer:v${{ github.run_number }}
          echo "✅ Pulled versioned image"

          echo "🛑 Stop old container"
          docker stop text-summarizer-container || true
          echo "🛑 Stopped old container"

          echo "🗑 Remove old container"
          docker rm text-summarizer-container || true
          echo "🗑 Removed old container"

          echo "🚀 Run new container"
          docker run -d \
            -p 127.0.0.1:8021:8000 \
            --name text-summarizer-container \
            --restart always \
            --env-file /data/Text_Summarizer/.env \
            --memory="512m" \
            --cpus="1.0" \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            krish1908/text-summarizer:v${{ github.run_number }}

          echo "⏳ Waiting for container..."
          sleep 5

          echo "🧪 Health check"
          curl -f http://127.0.0.1:8021 || exit 1

          echo "🔄 Reload nginx"
          sudo systemctl reload nginx

          echo "✅ On-Prem Deployment Done"

  # -------------------------
  # DEPLOY TO KM GCP
  # -------------------------
  deploy-km-gcp:
    name: Deploy to KM GCP
    runs-on: [self-hosted, ts, gcp, km]
    needs: build-and-push

    steps:
      - name: Deploy via Docker (KM GCP)
        run: |
          echo "🚀 Deploying to KM GCP..."

          echo "📥 Pull versioned image"
          docker pull krish1908/text-summarizer:v${{ github.run_number }}
          echo "✅ Pulled versioned image"

          echo "🛑 Stop old container"
          docker stop text-summarizer-km || true
          echo "🛑 Stopped old container"

          echo "🗑 Remove old container"
          docker rm text-summarizer-km || true
          echo "🗑 Removed old container"

          echo "🚀 Run new container"
          docker run -d \
            -p 127.0.0.1:8021:8000 \
            --name text-summarizer-km \
            --restart always \
            --env-file /var/krish/.env \
            -e OTEL_SERVICE_NAME=text-summarizer \
            -e OTEL_TRACES_EXPORTER=otlp \
            -e OTEL_METRICS_EXPORTER=none \
            -e OTEL_LOGS_EXPORTER=none \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=172.17.0.1:4317 \
            -e OTEL_EXPORTER_OTLP_PROTOCOL=grpc \
            -e OTEL_RESOURCE_ATTRIBUTES=deployment.environment=dev \
            --memory="512m" \
            --cpus="1.0" \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            krish1908/text-summarizer:v${{ github.run_number }}

          echo "⏳ Waiting for container..."
          sleep 5

          echo "🧪 Health check"
          curl -f http://127.0.0.1:8021 || exit 1

          echo "✅ KM GCP Deployment Done"