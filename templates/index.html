<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                    <h1>AI Text Summarizer</h1>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="settingsBtn">
                        <i class="fas fa-cog"></i> Settings
                    </button>
                    <button class="btn btn-primary" id="clearBtn">
                        <i class="fas fa-eraser"></i> Clear
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Configuration Panel -->
            <div class="config-panel" id="configPanel" style="display: none;">
                <div class="panel-header">
                    <h3><i class="fas fa-cog"></i> Configuration</h3>
                    <button class="btn-icon" id="closeSettings">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="config-form">
                    <div class="form-group">
                        <label for="modelSelect">Model</label>
                        <select id="modelSelect" class="form-select">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="temperature">Temperature</label>
                        <input type="range" id="temperature" min="0" max="1" step="0.1" value="0">
                        <span id="tempValue" class="temp-display">0.0</span>
                    </div>
                    <div class="form-group">
                        <label for="summaryType">Summary Type</label>
                        <select id="summaryType" class="form-select">
                            <option value="concise">Concise</option>
                            <option value="detailed">Detailed</option>
                            <option value="bullet">Bullet Points</option>
                            <option value="keypoints">Key Points</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="languageSelect">Language</label>
                        <select id="languageSelect" class="form-select">
                            <option value="auto">Auto-detect</option>
                            <option value="en">English</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" id="saveConfig">
                        <i class="fas fa-save"></i> Save Configuration
                    </button>
                </div>
            </div>

            <!-- Input Section -->
            <section class="input-section">
                <div class="section-header">
                    <h2><i class="fas fa-file-alt"></i> Input Text</h2>
                    <div class="text-stats">
                        <span id="charCount">0</span> characters
                        <span id="wordCount">0</span> words
                    </div>
                </div>
                <div class="input-controls">
                    <div class="control-group">
                        <button class="btn-icon" id="pasteBtn" title="Paste from clipboard">
                            <i class="fas fa-paste"></i>
                        </button>
                        <button class="btn-icon" id="fileBtn" title="Upload file">
                            <i class="fas fa-upload"></i>
                        </button>
                        <button class="btn-icon" id="sampleBtn" title="Load sample text">
                            <i class="fas fa-magic"></i>
                        </button>
                    </div>
                </div>
                <textarea 
                    id="inputText" 
                    placeholder="Paste your long article, document, or text here... The AI will generate a concise summary for you."
                    rows="10"
                ></textarea>
            </section>

            <!-- Action Section -->
            <section class="action-section">
                <div class="action-controls">
                    <button class="btn btn-primary btn-large" id="summarizeBtn">
                        <i class="fas fa-sparkles"></i>
                        <span>Generate Summary</span>
                    </button>
                    <div class="processing-indicator" id="processingIndicator" style="display: none;">
                        <div class="spinner"></div>
                        <span>Processing...</span>
                    </div>
                </div>
            </section>

            <!-- Output Section -->
            <section class="output-section">
                <div class="section-header">
                    <h2><i class="fas fa-scroll"></i> Summary</h2>
                    <div class="output-actions">
                        <button class="btn-icon" id="copyBtn" title="Copy to clipboard">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="btn-icon" id="downloadBtn" title="Download summary">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
                <div class="output-container">
                    <div id="summaryOutput" class="summary-output"></div>
                </div>
                <div class="summary-stats" id="summaryStats" style="display: none;">
                    <div class="stat-item">
                        <i class="fas fa-clock"></i>
                        <span id="processingTime">0s</span>
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-percentage"></i>
                        <span id="reductionRatio">0%</span> reduction
                    </div>
                    <div class="stat-item">
                        <i class="fas fa-file-alt"></i>
                        <span id="summaryWords">0</span> words
                    </div>
                </div>
            </section>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 AI Text Summarizer. Built with FastAPI and HTML/CSS.</p>
            </div>
        </footer>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf" style="display: none;">

    <script src="{{ url_for('static', path='script.js') }}"></script>
</body>
</html>
